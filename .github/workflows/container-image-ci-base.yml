name: ComfyUI
on:
  workflow_call:
    inputs:
      gpu-driver:
        required: true
        type: string
      build-type:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: thehonker/comfyui

jobs:
  build-and-push:
    runs-on: self-hosted
    name: ${{ inputs.gpu-driver }}
    timeout-minutes: 240
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone comfyui repo, apply any patches
        run: |
          COMFYUI_REPO=https://github.com/comfyanonymous/ComfyUI.git
          CLONE_DIR="${{ github.workspace }}/src/comfyui"

          if [[ ${{ inputs.build-type }} == "tag" ]]; then
            # Get the latest release tag from GitHub Releases API
            GIT_REF="$(curl -fsSL 'https://api.github.com/repos/comfyanonymous/ComfyUI/releases/latest' 2>/dev/null \
              | jq -r '.tag_name' \
              || true)"
            # Fallback: query releases list if /latest doesn't exist
            if [[ -z "${GIT_REF}" || "${GIT_REF}" == "null" ]]; then
              GIT_REF="$(curl -fsSL 'https://api.github.com/repos/comfyanonymous/ComfyUI/releases?per_page=1' \
                | jq -r '.[0].tag_name')"
            fi
            if [[ -z "${GIT_REF}" || "${GIT_REF}" == "null" ]]; then
              echo "ERROR: Could not determine latest release tag"
              exit 1
            fi
            echo "Latest release: ${GIT_REF}"
            git clone --single-branch --branch "${GIT_REF}" --depth=1 "${COMFYUI_REPO}" "${CLONE_DIR}"
          else
            git clone --single-branch --branch master --depth=1 "${COMFYUI_REPO}" "${CLONE_DIR}"
            GIT_REF="$(cd "${CLONE_DIR}" && git rev-parse --short HEAD)"
          fi
          echo "GIT_REF=${GIT_REF}" >> "$GITHUB_ENV"

          # Apply patches
          cd "${CLONE_DIR}"
          for patch in "${{ github.workspace }}/patches/${{ inputs.gpu-driver }}/"*.patch; do
            if test -f "$patch"; then
              echo "Applying patch $patch"
              git apply "$patch"
            fi
          done

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=raw,value=latest,priority=1000,prefix=${{ inputs.gpu-driver }}-,enable=${{ inputs.build-type == 'hash' }}
            type=raw,value=stable,priority=1000,prefix=${{ inputs.gpu-driver }}-,enable=${{ inputs.build-type == 'tag' }}
            type=schedule,enable=true,priority=900,pattern={{date 'YYYYMMDD'}},prefix=${{ inputs.gpu-driver }}-
            type=raw,value=${{ env.GIT_REF }},priority=800,prefix=${{ inputs.gpu-driver }}-
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and Push Image
        uses: docker/bake-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          source: .
          push: true
          files: |
            "./src/docker-bake.hcl"
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: build
          set: |
            build.dockerfile=Dockerfile.${{ inputs.gpu-driver }}

      - name: Update README with last built ref
        run: |
          README="README.md"
          DRIVER="${{ inputs.gpu-driver }}"

          # Get the full commit hash from the shallow clone for the nightly section
          FULL_HASH="$(cd '${{ github.workspace }}/src/comfyui' && git rev-parse HEAD)"
          SHORT_HASH="$(cd '${{ github.workspace }}/src/comfyui' && git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%d)"

          if [[ "${{ inputs.build-type }}" == "tag" ]]; then
            # Update stable section: replace the line starting with "Stable:"
            sed -i "/^Stable: /c\\Stable: \`${GIT_REF}\` (${BUILD_DATE})" "$README"
          else
            # Update nightly section: replace the line starting with "Nightly:"
            sed -i "/^Nightly: /c\\Nightly: [\`${SHORT_HASH}\`](https://github.com/comfyanonymous/ComfyUI/commit/${FULL_HASH}) (${BUILD_DATE})" "$README"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$README"
          git diff --cached --quiet || git commit -m "Update README: ${DRIVER} ${BUILD_DATE} (${{ inputs.build-type }})"
          git push
